[project]
name = "whisper-cpp"
version = "0.1.0"
description = "Whisper.cpp Python tools for model conversion (Core ML, PyTorch, HuggingFace)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "coremltools>=9.0",
    "openai-whisper>=20250625",
    "ane-transformers>=0.1.1",
    "transformers>=4.30.0",
    "huggingface-hub>=0.20.0",
    "numpy",
]
